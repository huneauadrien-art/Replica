# Budget du foyer sur le NAS. Dans UGOS Pro : Docker › Projet › Créer, collez ce fichier.
# Projet séparé du registre de la vigne : autre code, autre dossier de données, port 8081.
services:
  budget-foyer:
    image: ghcr.io/huneauadrien-art/budget-foyer:latest
    container_name: budget-foyer
    # Télécharge la dernière version à chaque démarrage du projet.
    pull_policy: always
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      # Le code que l'appli demandera. Choisissez-en un long, sans espace, différent de celui du registre.
      CODE: "remplacez-par-votre-code"
      TZ: "Europe/Paris"
    volumes:
      # Le budget et ses sauvegardes quotidiennes, dans le dossier du projet sur le NAS.
      - ./donnees:/donnees
