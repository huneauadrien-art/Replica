# Construit l'image Docker du serveur pour le NAS : ghcr.io/<compte>/registre-vigne:latest
name: Serveur NAS

on:
  push:
    branches: [main, claude/replica-skill-install-u8a3g6]
    paths: ['app/**', 'Dockerfile', '.dockerignore', '.github/workflows/serveur-nas.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: serveur-nas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Nom de l'image en minuscules
        id: nom
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/registre-vigne" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.nom.outputs.image }}:latest
            ${{ steps.nom.outputs.image }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
